[project]
name = "babelwrap"
version = "0.1.0"
description = "Python SDK for the BabelWrap API — the web, as an API, for your agents."
readme = "README.md"
license = "MIT"
authors = [{name = "Pedro M. Fernandes"}]
requires-python = ">=3.10"
keywords = ["browser", "automation", "ai-agents", "web-scraping", "sdk", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://babelwrap.com"
Documentation = "https://babelwrap.com/docs/quickstart"
Repository = "https://github.com/soulfir/babelwrap-python"
Issues = "https://github.com/soulfir/babelwrap-python/issues"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
